<html>

<head>

    <style>
        body {
            background-color: rgb(31, 31, 31);
            color: white;

        }

            flex-direction: column;
            justify-content: center;
        }

        #menu-container {
            position: relative;
            display: flex;
            justify-content: center;
            flex-direction: row;
            margin-top: 50px;
            margin-bottom: 30px;
        }

        .menu-item {
            color: #fff;
            text-decoration: #0000;
            cursor: pointer;
        }

        .menu-item:hover {

        }

        .selected {

        }

        #menu {

            margin-top: 10px;

            font-family: monospace;
            font-size: 20pt;

        }

        .sideline {

        }

        .content {

            text-align: center;
            flex-direction: column;

        }

        .contents {

            justify-content: center;

        .glider {

            width: 45px;
            vertical-align: text-bottom;

        .title-small {
            font-size: 70%;
            color: gray;
        }

        .sidelines {
            display: flex;
            flex-direction: row;
            justify-content: center;
        }


        .sidelines .bar {
            flex-grow: 1;
        }

        .sidelines .inner {
            flex: 1 1 auto;
            flex-direction: column;
            justify-content: center;
        }

        #menu-logo {
            rotate: 70deg;
            width: 150px;
        }

        @media (min-width: 850px) {
            .bar {
                flex: 0 0 260px;
            }
        }

        @media (min-width: 768px) {
            #menu {
                margin-left: 60px;
                font-size: 24pt;
            }

            #menu-logo {
                rotate: 0deg;
                width: 300px;
            }

            #menu-container {
                margin-top: 120px;
            }
        }

        #content-donate {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .copy-container {
            width: 200pt;
            padding: 4pt;
            margin: 4pt;
            border: 2pt dashed#ff5555;
            border-radius: 4pt;
        }

        .click-copy {
            font-family: monospace;
            user-select: all;
            overflow-wrap: break-word;
        }

        .click-copy:hover {
            cursor: alias;
            color: #ff5555;
        }
    </style>
    <title>undefspace</title>

    <script>
        var canvas = document.getElementById("test")

        function switchSection() {
            id = "content-" + location.hash.substr(1)

            if (document.getElementById(id) == null) {
                console.log("what do you think you are doing?")
                location.hash = "about"
                return
            }
            [...document.getElementsByClassName("content")].forEach(element => {
                element.style.display = element.id != id ? "none" : "flex";
            });

            [...document.getElementsByClassName("menu-item")].forEach(element => {
                element.classList.toggle("selected", element.hash == location.hash)
            });

        }

        window.addEventListener('hashchange', () => {
            switchSection("content-" + location.hash.substr(1))
            console.log("content-" + location.hash.substr(1))
        });

        window.addEventListener('load', () => {
            [...document.getElementsByClassName("click-copy")].forEach((el) => {
                el.addEventListener("click", () => {
                    navigator.clipboard.writeText(el.textContent.trim())
                })
            })
        })

        function start_spaceloop() {

            let targets = [
                "-visit-",
                "virtual",
                "-space-"
            ]
            let elem = document.getElementById("virtualspace")

            let l = targets[0].length
            let current = "virtual".split("")
            let not_selected = []
            let current_target = 0
            let tries = 0
            let syms = "~*^%&$#@!δVISTRLSPCE"

            function refill() {
                for (let i = 0; i < l; i++) {
                    not_selected.push(i);
                }
            }
            refill()

            function randint(n) {
                return Math.floor(Math.random() * n)
            }

            function spaceloop() {

                function resched(t) {
                    elem.innerText = "[" + current.join("") + "]"
                    setTimeout(spaceloop, t)
                }

                if (not_selected.length == 0) {
                    current_target += 1
                    current_target %= targets.length
                    tries = 0
                    refill()
                    resched(500)
                    return

                }

                tries++
                if (Math.random() < 0.05 * tries) {
                    // replacing real
                    let lucky_winner = randint(not_selected.length)
                    let index = not_selected[lucky_winner]
                    not_selected.splice(lucky_winner, 1)

                    current[index] = targets[current_target][index]
                    resched(30)
                    return
                } else {
                    // replacing unreal
                    current[not_selected[randint(not_selected.length)]] = syms[randint(syms.length)]
                    resched(30)
                    return
                }

            }

            spaceloop()
        }

    </script>
</head>

    <div class="main">
